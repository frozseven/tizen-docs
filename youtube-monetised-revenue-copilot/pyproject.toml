[project]
name = "ytcopilot"
version = "0.1.0"
description = "YouTube monetization diagnostic and content-planning copilot backed by real YouTube and Gemini APIs."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "google-api-python-client>=2.126",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "httpx>=0.27"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
ytcopilot = "ytcopilot.cli:_entrypoint"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ytcopilot*", "webapp*"]
