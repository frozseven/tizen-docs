{% extends "base.html" %}
{% block title %}Plan a video{% endblock %}
{% block content %}
<h2>Plan a video</h2>
<p class="muted">Generates a script, chapters, titles, description, and a thumbnail brief + image. This calls the Gemini API and uses real API quota.</p>

<div class="panel">
  <form method="post" action="/plan">
    <label for="topic">Topic / working title</label>
    <input type="text" id="topic" name="topic" value="{{ topic or '' }}" required>

    <label for="niche">Niche / topic cluster (optional)</label>
    <input type="text" id="niche" name="niche" value="">

    <label for="length_minutes">Target length (minutes)</label>
    <input type="number" id="length_minutes" name="length_minutes" value="10" min="1" max="20">

    <button type="submit">Generate</button>
  </form>
</div>
{% endblock %}
