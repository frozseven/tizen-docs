{% extends "base.html" %}
{% block title %}Rollout{% endblock %}
{% block content %}
<h2>Niche rollout plan</h2>
<div class="panel">
  <form method="get" action="/rollout">
    <label for="months">Spread window (months)</label>
    <input type="number" id="months" name="months" value="{{ months }}" min="1" max="12">
    <button type="submit">Update</button>
  </form>
</div>
<div class="panel"><pre>{{ md }}</pre></div>
{% endblock %}
